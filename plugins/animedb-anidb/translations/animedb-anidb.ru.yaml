widget:
    related:
        title: Связанные аниме
        description: Показывает продолжения, предыстории, побочные истории и другие тайтлы, связанные по данным AniDB.
    similar:
        title: Похожие аниме
        description: Показывает аниме, которые AniDB указывает как похожие на этот тайтл.
