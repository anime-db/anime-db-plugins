# This plugin's own routes. The host reads this file from the plugin's root (not `config/`).

animedb_folder_info_write:
    path: /plugins/animedb-folder-info/{id}/write
    controller: AnimeDb\Plugins\AnimedbFolderInfo\Controller\WriteFolderController
    methods: [POST]
    requirements:
        id: '\d+'

animedb_folder_info_settings:
    path: /plugins/animedb-folder-info/settings
    controller: AnimeDb\Plugins\AnimedbFolderInfo\Settings\FolderInfoSettingsController
    methods: [POST]
