widget:
    folder:
        title: Папка
        description: По кнопке записывает описание и обложку записи в её собственную папку.
        written_at: записано
        status:
            written: Записано в папку
            absent: Описание ещё не записано
            modified: Файл изменён вне AnimeDB
            no_folder: У записи нет своей папки
            unavailable: Хранилище недоступно
            not_writable: Хранилище только для чтения
        button:
            write: Записать описание в папку
            overwrite: Перезаписать
        error:
            invalid_form: Некорректная отправка формы, перезагрузите страницу и повторите.
            invalid_csrf: Недействительный CSRF-токен, перезагрузите страницу и повторите.
            write_failed: Не удалось записать файлы, повторите попытку.
info:
    alternative_names: Альтернативные названия
    type: Тип
    type_value:
        tv: ТВ-сериал
        movie: Фильм
        ova: OVA
        ona: ONA
        special: Спецвыпуск
        music: Музыка
    episodes: Серии
    duration: Длительность
    minutes: мин.
    date_premiere: Премьера
    date_end: Окончание
    studios: Студии
    countries: Страны
    genres: Жанры
    themes: Темы
    description: Описание
settings:
    auto:
        label: Заполнять автоматически
        hint: Когда появляется папка или меняется описание либо обложка, файлы записываются без нажатия кнопки. Файл, изменённый вне AnimeDB, автоматика никогда не заменяет; это делает только кнопка в виджете записи.
    save_button: Сохранить
    saved: Сохранено.
    fill_all:
        button: Заполнить все папки
        hint: В фоне записывает файлы в папки всех записей, в том числе при выключенной автоматике. Файлы, изменённые вне AnimeDB, пропускаются.
        started: Прогон запущен.
    summary:
        heading: Итог последнего прогона
        none: Прогонов ещё не было.
        running: Прогон выполняется.
        finished_at: Завершён
        written: 'Актуально: %count%'
        modified: 'Изменено вне AnimeDB: %count%'
        no_folder: 'Нет своей папки: %count%'
        unavailable: 'Хранилище недоступно: %count%'
        not_writable: 'Запись запрещена: %count%'
        failed: 'Сбой: %count%'
        not_writable_hint: Хранилище только для чтения или ещё не просканировано — просканируйте его.
    error:
        invalid_form: Некорректная отправка формы, перезагрузите страницу и повторите.
        invalid_csrf: Недействительный CSRF-токен, перезагрузите страницу и повторите.
        concurrent_write: Настройки сейчас сохраняются, повторите попытку.
        save_failed: Не удалось сохранить настройки, повторите попытку.
