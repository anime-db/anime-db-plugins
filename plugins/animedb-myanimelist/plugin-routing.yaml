# This plugin's own routes. The host reads this file from the plugin's root (not `config/`).

animedb_myanimelist_oauth_start:
    path: /oauth/myanimelist/start
    controller: AnimeDb\Plugins\AnimedbMyanimelist\OAuth\MalOAuthStartController
    methods: [GET]

# Must match this plugin's MyAnimeList application's registered `redirect_uri` byte-for-byte,
# including the port: http://127.0.0.1:41813/oauth/myanimelist.
animedb_myanimelist_oauth_callback:
    path: /oauth/myanimelist
    controller: AnimeDb\Plugins\AnimedbMyanimelist\OAuth\MalOAuthCallbackController
    methods: [GET]

animedb_myanimelist_oauth_disconnect:
    path: /plugins/animedb-myanimelist/oauth/disconnect
    controller: AnimeDb\Plugins\AnimedbMyanimelist\OAuth\MalOAuthDisconnectController
    methods: [POST]
