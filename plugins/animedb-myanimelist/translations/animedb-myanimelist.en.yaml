settings:
    account:
        heading: MyAnimeList account
        status_authorized: Authorized
        status_not_authorized: Not authorized
        reauthorize_link: Re-authorize
        disconnect_button: Disconnect
        authorize_link: Authorize

oauth_result:
    page_title: MyAnimeList authorization
    heading:
        success: Done
        failure: Authorization not completed
    message:
        cancelled: Authorization was cancelled or did not complete. You can close this tab and try again from the app.
        failed: Could not complete MyAnimeList authorization. Please try again from the app.
        success: Authorization complete. You can close this tab and return to the app.
    warning:
        probe_failed: The token was saved, but a verification request to MyAnimeList did not succeed. Syncing will retry it later.
