        description: Показывает аниме, которые сообщество MyAnimeList рекомендует вместе с этим аниме.

oauth_result:
    page_title: Авторизация MyAnimeList
    heading:
        success: Готово
        failure: Авторизация не завершена
    message:
        cancelled: Авторизация была отменена или не завершилась. Можно закрыть эту вкладку и попробовать снова из приложения.
        failed: Не удалось завершить авторизацию в MyAnimeList. Попробуйте снова из приложения.
        success: Авторизация завершена. Можно закрыть эту вкладку и вернуться в приложение.
    warning:
        probe_failed: Токен сохранён, но проверочный запрос к MyAnimeList не выполнился. Синхронизация повторит попытку позже.
