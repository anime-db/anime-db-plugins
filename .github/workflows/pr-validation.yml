name: PR validation

on:
  pull_request:

# Отменяем устаревший прогон валидации при новом пуше в тот же PR
# (частые автоправки openronin) — экономит минуты Actions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # anime-db/plugin-contracts подключается из публичного VCS-репозитория
      # (см. repositories в composer.json), не из Packagist. Пакет публичный —
      # аутентификация не нужна, поэтому PR из форков валидируются штатно.
      #
      # --no-scripts --no-plugins: install выполняется на коде PR, поэтому исполнять
      # composer-скрипты/плагины из недоверенного composer.json нельзя.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins

      # Трогает ли PR плагины? Плагин-гейт (ниже) применяем ТОЛЬКО к таким PR; чисто
      # инфраструктурные (tools/ / .github/ / доки / реестр) его больше не спотыкают —
      # раньше гейт стоял безусловно первым и ронял их в красный, из-за чего до
      # PHPStan/cs-check дело вообще не доходило.
      - name: Detect plugin changes
        id: diff
        run: |
          set -euo pipefail
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > changed-files.txt
          if grep -q '^plugins/' changed-files.txt; then
            echo "touches_plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches_plugins=false" >> "$GITHUB_OUTPUT"
            echo "Чисто инфраструктурный PR (без изменений в plugins/) — плагин-гейт пропущен, гоняются только PHPStan и cs-check."
          fi

      # Гейт: PR затрагивает ровно один плагин и только его код внутри plugins/<id>/.
      # Смешанный PR (плагин + пути вне plugins/) отклоняется. Порядок важен для
      # безопасности: гейт (и его отказ) идёт ДО PHPStan/cs-check, которые исполняют
      # конфиги репозитория (.php-cs-fixer.dist.php — это PHP-файл; phpstan.neon.dist
      # может тянуть bootstrap). На PR, правящем эти конфиги вместе с плагином, гейт
      # валит шаг раньше, чем недоверенный конфиг будет исполнен.
      #
      # check-pr-changes.php вызываем простой командой с редиректом (не через пайп
      # и не в присваивании $()) — иначе его ненулевой код маскируется (tee/командная
      # подстановка), и гейт молча проходит. Так set -e корректно валит шаг.
      - name: Gate — one plugin / only its code
        if: steps.diff.outputs.touches_plugins == 'true'
        run: |
          set -euo pipefail
          php tools/check-pr-changes.php < changed-files.txt > affected-plugin.txt
          echo "Gated to plugin: $(cat affected-plugin.txt)"

      - name: Validate affected plugin
        if: steps.diff.outputs.touches_plugins == 'true'
        run: php tools/validate-plugin.php "plugins/$(cat affected-plugin.txt)"

      # Гейт: правка опубликованного содержимого плагина обязана поднимать version в его
      # manifest.json (issue #87). Без этого release.yml находит уже опубликованный тег
      # <id>/<version> и МОЛЧА пропускает плагин: правка не доезжает до пользователей, а
      # CI при этом зелёный.
      #
      # Стоит после плагин-гейта намеренно: check-version-bump.php и его классы из
      # tools/src/ исполняются из чекаута PR, а гарантию, что tools/ на плагинном PR —
      # доверенное содержимое базовой ветки, даёт именно гейт «только код плагина».
      #
      # После validate-plugin.php: ошибки самого плагина (манифест, каталоги) важнее
      # отсутствия бампа, и их исправление всё равно меняет содержимое.
      #
      # Base — SHA, а не имя ветки: GitManifestVersionSource читает базовый манифест через
      # `git show <ref>:...`, для чего fetch-depth: 0 выше и нужен. Проверка существования
      # тега идёт через `git ls-remote` по origin — ни gh, ни токена не требует, репозиторий
      # публичный.
      #
      # Редирект, а не пайп: ненулевой код скрипта не должен маскироваться, ровно как у
      # check-pr-changes.php выше.
      - name: Gate — version bump for published plugin content
        if: steps.diff.outputs.touches_plugins == 'true'
        run: |
          set -euo pipefail
          php tools/check-version-bump.php "${{ github.event.pull_request.base.sha }}" < changed-files.txt

      # Гейт: код плагина проходит PHPStan с тем набором правил, который пакет контрактов
      # объявляет в своём extension.neon (на контракте v0.17.1 их три:
      # NoDangerousPrimitivesRule, ContractConformanceRule, NoNetworkAccessInLocalPluginsRule).
      # Список правил здесь не дублируется намеренно: релиз контракта с новым правилом
      # включает его тут сам, через плавающий ~0.14.
      #
      # До issue #111 эти правила не применялись ни к одному плагину — phpstan.neon.dist
      # перечисляет только tools/, а extension.neon пакета не был подключён ни автоматически,
      # ни вручную. Плагин с exec() или походом в сеть мимо абстракций хоста проходил
      # валидацию зелёным.
      #
      # Никакой отдельной установки зависимостей плагина здесь нет и быть не должно: среда
      # анализа — vendor/ этого репозитория, объявленный в его require-dev. Так же устроен
      # и рантайм — vendor/ плагина в дистрибутив не попадает, все классы даёт хост, значит
      # плагин может опираться только на поверхность хоста. Установка того, что плагин
      # попросил в собственном composer.json (недоверенном, он приезжает этим же PR),
      # проверяла бы его против поверхности, которой в рантайме не будет.
      #
      # Стоит после гейта «один плагин / только его код» намеренно (как и все шаги выше):
      # именно он гарантирует, что tools/ и конфиги на плагинном PR — содержимое базовой
      # ветки.
      #
      # Плагин без единого публикуемого .php (тип translation) пропускается, шаг зелёный.
      - name: Gate — plugin code analysis
        if: steps.diff.outputs.touches_plugins == 'true'
        run: php tools/analyse-plugin.php "plugins/$(cat affected-plugin.txt)"

      # Тесты, PHPStan и cs-check — тулинг качества всего репозитория (в т.ч. tools/).
      # Гоняются на КАЖДОМ PR: на плагинных (после гейта — конфиги тогда доверенные,
      # = базовые) и на инфраструктурных (плагин-гейт пропущен).
      #
      # Порядок тот же, что у гейта: PHPUnit тоже исполняет конфиг репозитория
      # (phpunit.xml.dist тянет bootstrap) и код тестов, поэтому стоит ПОСЛЕ
      # плагин-гейта, а не до него.
      #
      # Условие на PHPStan/cs-check: красный PHPUnit не должен скрывать их замечания —
      # по одному прогону видно всё сразу. Но одного `!cancelled()` тут НЕДОСТАТОЧНО:
      # он отменяет неявный success(), поэтому шаги отработали бы и после ПАДЕНИЯ гейта,
      # то есть недоверенный конфиг со смешанного PR всё-таки был бы исполнен — ровно то,
      # что гейт предотвращает.
      #
      # Поэтому ориентируемся на outcome шага Tests. У него самого условия нет, значит
      # действует неявный success(): он запускается только когда всё до него (установка
      # зависимостей, гейт, валидация плагина) прошло. Его `skipped` — признак того, что
      # что-то раньше упало, и тогда PHPStan/cs-check тоже не должны стартовать.
      # Единственный случай, который мы намеренно терпим, — Tests со статусом failure.
      - name: Tests (tooling)
        id: tests
        run: composer test

      - name: PHPStan (tooling)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: composer phpstan

      - name: Code style (tooling)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: composer cs-check

      # Собственный набор тестов затронутого плагина (issue #147). До этого шага его не
      # запускал НИКТО: `composer test` выше гоняет корневой phpunit.xml.dist, а там один
      # testsuite — `tests`, то есть тулинг. Каталог `plugins/<id>/tests/` в него не входил,
      # поэтому плагин мог приехать с полным набором тестов, пройти ревью как «покрыто
      # тестом» и не получить ни одной исполненной проверки. Единственным шагом, доходившим
      # до кода плагина, был анализ выше — а он статический: видит типы, но не поведение.
      #
      # Зависимости плагина здесь так же не ставятся, как и на шаге анализа, и по той же
      # причине — среда исполнения это vendor/ репозитория. Но есть и вторая, своя:
      # `composer install` по composer.json плагина ИСПОЛНИЛ бы его (скрипты и плагины
      # Composer), причём из манифеста, приехавшего этим же PR.
      #
      # Собственный phpunit.xml.dist плагина намеренно не используется: он указывает
      # bootstrap на vendor/ плагина — ровно ту среду, которую мы исключили, — и приезжает
      # тем же PR, то есть PR выбирал бы, как его проверяют. Скрипт подставляет свой
      # bootstrap и --no-configuration.
      #
      # Позиция после гейта — обязательна и по более сильной причине, чем у шагов выше:
      # те исполняют конфиги репозитория, а этот исполняет тестовый код ПЛАГИНА из PR.
      # Гейт «один плагин / только его код» — то, что не даёт смешанному PR подменить сам
      # tools/test-plugin.php в том же прогоне. Симлинки под tests/ скрипт отклоняет
      # отдельно: он этот каталог исполняет, значит ссылка не может решать, что запустится.
      #
      # Условие то же, что у PHPStan/cs-check, и по той же логике: `!cancelled()` один не
      # годится (снял бы неявный success() и пропустил шаг даже после падения гейта),
      # поэтому ориентируемся на outcome шага Tests. Плюс touches_plugins — на
      # инфраструктурном PR запускать нечего.
      #
      # Стоит последним, а не сразу после анализа, чтобы красный набор плагина не прятал
      # замечания PHPStan и cs-check: по одному прогону видно всё сразу.
      #
      # Плагин без tests/ или без единого *Test.php (тип translation) пропускается, шаг
      # зелёный и говорит об этом явной строкой SKIP.
      - name: Tests (plugin)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && steps.diff.outputs.touches_plugins == 'true' }}
        run: php tools/test-plugin.php "plugins/$(cat affected-plugin.txt)"
