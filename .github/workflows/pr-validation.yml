name: PR validation

on:
  pull_request:

# Отменяем устаревший прогон валидации при новом пуше в тот же PR
# (частые автоправки openronin) — экономит минуты Actions.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # anime-db/plugin-contracts подключается из публичного VCS-репозитория
      # (см. repositories в composer.json), не из Packagist. Пакет публичный —
      # аутентификация не нужна, поэтому PR из форков валидируются штатно.
      #
      # --no-scripts --no-plugins: install выполняется на коде PR, поэтому исполнять
      # composer-скрипты/плагины из недоверенного composer.json нельзя.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-plugins

      # Трогает ли PR плагины? Плагин-гейт (ниже) применяем ТОЛЬКО к таким PR; чисто
      # инфраструктурные (tools/ / .github/ / доки / реестр) его больше не спотыкают —
      # раньше гейт стоял безусловно первым и ронял их в красный, из-за чего до
      # PHPStan/cs-check дело вообще не доходило.
      - name: Detect plugin changes
        id: diff
        run: |
          set -euo pipefail
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            > changed-files.txt
          if grep -q '^plugins/' changed-files.txt; then
            echo "touches_plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "touches_plugins=false" >> "$GITHUB_OUTPUT"
            echo "Чисто инфраструктурный PR (без изменений в plugins/) — плагин-гейт пропущен, гоняются только PHPStan и cs-check."
          fi

      # Гейт: PR затрагивает ровно один плагин и только его код внутри plugins/<id>/.
      # Смешанный PR (плагин + пути вне plugins/) отклоняется. Порядок важен для
      # безопасности: гейт (и его отказ) идёт ДО PHPStan/cs-check, которые исполняют
      # конфиги репозитория (.php-cs-fixer.dist.php — это PHP-файл; phpstan.neon.dist
      # может тянуть bootstrap). На PR, правящем эти конфиги вместе с плагином, гейт
      # валит шаг раньше, чем недоверенный конфиг будет исполнен.
      #
      # check-pr-changes.php вызываем простой командой с редиректом (не через пайп
      # и не в присваивании $()) — иначе его ненулевой код маскируется (tee/командная
      # подстановка), и гейт молча проходит. Так set -e корректно валит шаг.
      - name: Gate — one plugin / only its code
        if: steps.diff.outputs.touches_plugins == 'true'
        run: |
          set -euo pipefail
          php tools/check-pr-changes.php < changed-files.txt > affected-plugin.txt
          echo "Gated to plugin: $(cat affected-plugin.txt)"

      - name: Validate affected plugin
        if: steps.diff.outputs.touches_plugins == 'true'
        run: php tools/validate-plugin.php "plugins/$(cat affected-plugin.txt)"

      # Тесты, PHPStan и cs-check — тулинг качества всего репозитория (в т.ч. tools/).
      # Гоняются на КАЖДОМ PR: на плагинных (после гейта — конфиги тогда доверенные,
      # = базовые) и на инфраструктурных (плагин-гейт пропущен).
      #
      # Порядок тот же, что у гейта: PHPUnit тоже исполняет конфиг репозитория
      # (phpunit.xml.dist тянет bootstrap) и код тестов, поэтому стоит ПОСЛЕ
      # плагин-гейта, а не до него.
      #
      # `!cancelled()` на последующих шагах: красный PHPUnit не должен скрывать
      # замечания PHPStan и cs-check — по одному прогону видно всё сразу.
      - name: Tests (tooling)
        run: composer test

      - name: PHPStan (tooling)
        if: ${{ !cancelled() }}
        run: composer phpstan

      - name: Code style (tooling)
        if: ${{ !cancelled() }}
        run: composer cs-check
