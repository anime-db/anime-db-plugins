name: Release plugins

# Reconcile: на каждый плагин в plugins/<id>/ проверяет, есть ли Release
# <id>/<version> (version из manifest.json). Если нет — собирает ZIP, ЗАЛИВАЕТ
# ассеты на зеркала (MIRROR_CREDS, см. issue #14) и публикует Release с ассетами
# plugin.zip + manifest.json + sha256. Идемпотентно: уже опубликованные версии
# пропускаются. Первый прогон подхватит уже закоммиченные плагины, у которых
# Release ещё нет.
#
# Порядок «ассеты на зеркала → потом Release → потом реестр»: заливка на зеркала
# идёт ДО gh release create. Провал заливки роняет джоб до создания Release, значит
# версия не выходит, а registry.yml (триггерится по успешному завершению этого
# воркфлоу) реестр не пересобирает — реестр никогда не сошлётся на неразложенные
# по зеркалам ассеты (инвариант «ассеты до реестра», #14).

on:
  push:
    branches: [master]
    paths-ignore:
      # Коммит самого реестра и его подписи (см. registry.yml) не должен ретриггерить цепочку.
      - 'plugins-registry.json'
      - 'plugins-registry.json.sig'
  workflow_dispatch:

permissions:
  contents: write
  # Генерация release notes читает связку commit→PR через gh api .../commits/<sha>/pulls.
  pull-requests: read

# Сериализуем прогоны: два параллельных reconcile-джоба могли бы оба увидеть
# «релиза ещё нет» и оба дойти до gh release create одного тега — проигравший
# упал бы с «already exists», оборвав публикацию остальных плагинов.
concurrency:
  group: release-plugins
  cancel-in-progress: false

jobs:
  release:
    name: Reconcile plugin releases
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Креды зеркал: JSON, ключёванный по id зеркала (host/port/user/password/dir/protocol).
      # Не задан/пуст → push-mirror-assets.php no-op (зеркала — опциональная инфра).
      MIRROR_CREDS: ${{ secrets.MIRROR_CREDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история + теги нужны генерации release notes: выбор предыдущего
          # тега плагина (pick-prev) и git log по диапазону предыдущий-тег..HEAD.
          # Shallow-checkout (глубина 1, по умолчанию) их не даёт.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          # ext-ftp нужен FtpMirrorTransport (composer.json требует ext-ftp) —
          # задаём явно, чтобы composer install не упал на platform-check.
          extensions: ftp

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # Контракт — из публичного VCS-репозитория (composer.json), токен не нужен.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reconcile releases
        run: |
          set -euo pipefail

          # Собирает тело release notes для одного плагина и печатает его в stdout.
          # Диапазон — предыдущий-тег-этого-плагина..HEAD, отфильтрованный по plugins/<id>/
          # (в монорепе gh --generate-notes так по пути не умеет). Связка commit→PR — через
          # авторитетный gh api .../commits/<sha>/pulls, не regex по subject (#28: "#NN" в
          # subject часто оказывается номером issue, а не PR). Возвращает ненулевой код при
          # любой ошибке — вызывающий код (fail-open ниже) тогда откатится на заглушку, чтобы
          # генерация заметок никогда не срывала публикацию релиза.
          generate_release_notes() {
            local id="$1" version="$2"
            local prev range commits_json prs
            local -a prev_arg=()

            prev="$(git tag --list "$id/*" | php tools/build-release-notes.php pick-prev "$version")" || return 1
            if [ -n "$prev" ]; then
              range="$prev..HEAD"
              prev_arg=(--prev "$prev")
            else
              range="HEAD"
            fi

            # По каждому коммиту диапазона (уже отфильтрован по пути плагина) добираем
            # связанные PR и собираем JSON-массив, который ест `format`. Строковые поля
            # передаём как данные (jq --arg / --argjson), без склейки строк.
            commits_json="$(
              git log "$range" --format='%H%x1f%s%x1f%an' -- "plugins/$id/" \
                | while IFS=$'\x1f' read -r sha subject author; do
                    # .user == null у PR с удалённым аккаунтом автора (ghost) — иначе author
                    # стал бы null, парсер отверг бы его и по fail-open весь релиз ушёл бы в
                    # заглушку из-за одного такого PR. "ghost" совпадает с рендером GitHub.
                    prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                      --jq '[.[] | {number, title, url: .html_url, author: (.user.login // "ghost")}]')" || exit 1
                    jq -n \
                      --arg sha "$sha" --arg subject "$subject" --arg author "$author" \
                      --argjson prs "$prs" \
                      '{sha: $sha, subject: $subject, author: $author, prs: $prs}'
                  done \
                | jq -s '.'
            )" || return 1

            php tools/build-release-notes.php format \
              --id "$id" --version "$version" --repo "$GITHUB_REPOSITORY" "${prev_arg[@]}" \
              <<<"$commits_json" || return 1
          }

          for plugin in plugins/*/; do
            id="$(basename "$plugin")"
            manifest="plugins/$id/manifest.json"
            if [ ! -f "$manifest" ]; then
              echo "::warning::plugins/$id has no manifest.json — skipping."
              continue
            fi
            version="$(jq -r '.version' "$manifest")"
            tag="$id/$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists — skipping."
              continue
            fi
            echo "Building and publishing $tag ..."
            workdir="$(mktemp -d)"
            # build-plugin-zip.php пишет plugin.zip и рядом файл sha256.
            php tools/build-plugin-zip.php "plugins/$id" "$workdir/plugin.zip"
            cp "$manifest" "$workdir/manifest.json"
            # Заливаем ассеты (plugin.zip + manifest.json) на все зеркала из
            # MIRROR_CREDS ДО публикации Release. Exit 1 → джоб падает здесь,
            # Release не создаётся, реестр не публикуется (инвариант «ассеты до
            # реестра»). Пусто/не задано → no-op. Идемпотентно: уже залитые файлы
            # не перезаписываются.
            echo "Pushing $tag assets to mirrors ..."
            php tools/push-mirror-assets.php "$id" "$version" "$workdir" MIRROR_CREDS

            # Информативные release notes. Fail-open: любая ошибка генерации (сеть gh api,
            # git, парсинг) → заглушка, публикация релиза не срывается.
            notes_file="$workdir/notes.md"
            notes_args=(--notes "Автоматический релиз $id $version.")
            if generate_release_notes "$id" "$version" > "$notes_file" 2>"$workdir/notes.err"; then
              notes_args=(--notes-file "$notes_file")
            else
              echo "::warning::Не удалось сгенерировать release notes для $tag, использую заглушку. $(tr '\n' ' ' < "$workdir/notes.err")"
            fi

            gh release create "$tag" \
              --title "$tag" \
              "${notes_args[@]}" \
              "$workdir/plugin.zip" "$workdir/manifest.json" "$workdir/sha256"
            rm -rf "$workdir"
          done
