name: Build plugins registry

# Пересобирает корневой plugins-registry.json после релиз-воркфлоу. Собирает по
# опубликованным Release'ам список {id, version, core, sha256} (core — из ассета
# manifest.json версии, sha256 — из ассета sha256), подаёт его вместе с текущими
# манифестами в tools/build-registry.php и коммитит результат в master, если он
# изменился. Идемпотентно: без изменений коммита нет.
#
# Триггер — workflow_run по завершении "Release plugins": так реестр собирается
# ГАРАНТИРОВАННО после публикации новых версий (снимает гонку «реестр до релиза»).

on:
  workflow_run:
    workflows: ["Release plugins"]
    types: [completed]
  # Ручной прогон: пересобрать/подписать реестр без релиза плагина. Нужен, чтобы
  # изменение состава зеркал (`active-mirrors` + `MIRROR_CREDS`) попало в подписанный
  # `asset_mirrors` — например после активации нового зеркала (workflow «Backfill
  # mirror» коммитит `active-mirrors`, а этот прогон подтягивает его в реестр) или для
  # срочного де-листинга скомпрометированного зеркала (убрать id из `active-mirrors`).
  workflow_dispatch:

permissions:
  contents: write

# Сериализуем: несколько подряд завершившихся «Release plugins» дали бы
# параллельные пересборки, конкурирующие за push в master.
concurrency:
  group: build-plugins-registry
  cancel-in-progress: false

jobs:
  registry:
    name: Rebuild plugins-registry.json
    # workflow_run от «Release plugins» гоняем только при успехе; ручной workflow_dispatch
    # (у него нет github.event.workflow_run) — всегда.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Креды зеркал (JSON по id зеркала). Пусто/не задано → push-mirror-registry.php no-op.
      MIRROR_CREDS: ${{ secrets.MIRROR_CREDS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          # ext-ftp нужен FtpMirrorTransport (composer.json требует ext-ftp).
          extensions: ftp

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      # Контракт — из публичного VCS-репозитория (composer.json), токен не нужен.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Collect published versions
        run: |
          set -euo pipefail
          echo "[]" > published-versions.json
          tmp="$(mktemp -d)"
          tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
          for tag in $tags; do
            # Ожидаем форму <id>/<version>. Посторонние теги (ручные релизы,
            # анонсы) и релизы без нужных ассетов пропускаем с предупреждением,
            # чтобы один нестандартный релиз не ронял пересборку всего реестра.
            case "$tag" in
              */*) : ;;
              *) echo "::warning::Пропускаю релиз \"$tag\": тег не в форме <id>/<version>."; continue ;;
            esac
            id="${tag%%/*}"
            version="${tag#*/}"
            if ! gh release download "$tag" --dir "$tmp" --clobber \
                --pattern manifest.json --pattern sha256; then
              echo "::warning::Пропускаю \"$tag\": не удалось скачать ассеты manifest.json/sha256."
              continue
            fi
            if [ ! -f "$tmp/manifest.json" ] || [ ! -f "$tmp/sha256" ]; then
              echo "::warning::Пропускаю \"$tag\": нет ассета manifest.json или sha256."
              rm -f "$tmp/manifest.json" "$tmp/sha256"
              continue
            fi
            core="$(jq -r '.require.core // empty' "$tmp/manifest.json")"
            sha256="$(tr -d '[:space:]' < "$tmp/sha256")"
            if [ -z "$core" ] || [ -z "$sha256" ]; then
              echo "::warning::Пропускаю \"$tag\": пустой require.core или sha256."
              rm -f "$tmp/manifest.json" "$tmp/sha256"
              continue
            fi
            # translation_keys_count и locales переносятся из СКАЧАННОГО релизного ассета, а
            # не из plugins/<id>/manifest.json рабочего дерева: versions[] описывает то, что
            # реально опубликовано под тегом, а master — возможно ещё не выпущенное
            # состояние. Плюс resolveCompatibleVersion() на стороне приложения может
            # ставить не последнюю версию, и значения из master описывали бы не тот артефакт.
            # Для locales это несущее: витрина маркета показывает языки той версии, которая
            # реально установится, а не последней опубликованной (anime-db-desktop#543).
            #
            # Через --slurpfile и has(), а не через `// empty` + tonumber: так сохраняется
            # исходный JSON-тип значения. Строка "356" в манифесте доедет до
            # build-registry.php строкой и будет там отвергнута, тогда как tonumber молча
            # привёл бы её к числу и обошёл проверку. То же и для locales: строка вместо
            # списка или список не-строк доезжает как есть и отвергается валидацией
            # PluginRegistryBuilder. Workflow переносит, валидирует тулинг.
            #
            # has() (а не значение) — потому что отсутствие поля должно оставаться
            # отсутствием ключа, а не null: у версий, выпущенных до появления поля, ассеты
            # иммутабельны и получить его уже не могут, и приложение обязано отличать
            # «покрытие неизвестно» от «переведено ноль строк», а «языки неизвестны» — от
            # «плагин не везёт ни одного языка».
            jq \
              --arg id "$id" --arg version "$version" --arg core "$core" --arg sha256 "$sha256" \
              --slurpfile manifest "$tmp/manifest.json" \
              '. += [{id: $id, version: $version, core: $core, sha256: $sha256}
                     + (if ($manifest[0] | has("translation_keys_count"))
                        then {translation_keys_count: $manifest[0].translation_keys_count}
                        else {} end)
                     + (if ($manifest[0] | has("locales"))
                        then {locales: $manifest[0].locales}
                        else {} end)]' \
              published-versions.json > published-versions.tmp
            mv published-versions.tmp published-versions.json
            rm -f "$tmp/manifest.json" "$tmp/sha256"
          done

      - name: Build registry
        run: |
          set -euo pipefail
          # Передаём текущий опубликованный реестр как «предыдущий», чтобы его
          # anti-rollback `sequence` строго возрастал (previous.sequence + 1). На самом
          # первом прогоне файла ещё нет — инструмент стартует sequence с 1. НЕЛЬЗЯ
          # редиректить stdout в тот же путь, что дан «предыдущим» — шелл обнулит его
          # раньше, чем скрипт прочитает. Пишем в новый путь.
          #
          # Аргументы 4-5 (`active-mirrors` + имя env-переменной `MIRROR_CREDS`) собирают
          # `asset_mirrors` = [GitHub] + public_url тех зеркал, чей id в `active-mirrors`
          # (issue #26). Кривой/осиротевший public_url выбрасывается с ::warning:: в STDERR
          # (fail-open, не роняет сборку). MIRROR_CREDS уже в env джоба; пусто → [GitHub].
          php tools/build-registry.php plugins published-versions.json plugins-registry.json active-mirrors MIRROR_CREDS > plugins-registry.json.new

      - name: Skip when registry content is unchanged
        id: changed
        run: |
          set -euo pipefail
          # Пропускаем ТОЛЬКО если реестр уже есть, УЖЕ ПОДПИСАН и по содержанию не
          # изменился. Сравниваем БЕЗ поля sequence: иначе идентичный по содержанию
          # реестр бампил бы счётчик и коммитил на каждый триггерящий Release-прогон.
          # Проверка наличия .sig обязательна: если реестр закоммичен без подписи
          # (напр. до включения подписи, или прогоном старого воркфлоу), то без неё
          # guard считал бы контент «неизменным» и неподписанный реестр залип бы
          # навсегда — отсутствие .sig принудительно ведёт к пере-сборке и подписи.
          if [ -f plugins-registry.json ] \
            && [ -f plugins-registry.json.sig ] \
            && diff -q <(jq -S 'del(.sequence)' plugins-registry.json) \
                       <(jq -S 'del(.sequence)' plugins-registry.json.new) >/dev/null; then
            echo "Registry content unchanged — keeping existing registry and sequence."
            rm -f plugins-registry.json.new
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv plugins-registry.json.new plugins-registry.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign registry
        if: steps.changed.outputs.changed == 'true'
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY_SIGNING_KEY:-}" ]; then
            echo "::error::Секрет REGISTRY_SIGNING_KEY не задан — реестр нельзя подписать."
            exit 1
          fi
          php tools/sign-registry.php plugins-registry.json REGISTRY_SIGNING_KEY > plugins-registry.json.sig
          # Самопроверка: подпись должна пройти против закоммиченного публичного ключа —
          # иначе CI подписал ключом, не совпадающим с тем, что зашивается в клиент (#292).
          php tools/verify-registry-signature.php plugins-registry.json plugins-registry.json.sig plugins-registry.pub

      - name: Push registry to mirrors
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Заливаем подписанный реестр + подпись в корень каждого зеркала из MIRROR_CREDS
          # (перезапись — реестр мутабелен). ДО коммита в master: провал заливки роняет
          # джоб, коммита нет → на следующем прогоне реестр пересоберётся (changed=true)
          # и заливка ретраится. Ассеты уже на зеркалах (release.yml отработал раньше).
          # MIRROR_CREDS пусто/не задано → CLI no-op (зеркала опциональны).
          php tools/push-mirror-registry.php plugins-registry.json plugins-registry.json.sig MIRROR_CREDS

      - name: Commit if changed
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add plugins-registry.json plugins-registry.json.sig
          if git diff --cached --quiet; then
            echo "Nothing staged — nothing to commit."
            exit 0
          fi
          git config user.name "anime-db-bot"
          git config user.email "bot@anime-db.org"
          git commit -m "ci: rebuild and sign plugins-registry.json"
          # concurrency сериализует джобы, но master мог уйти вперёд между checkout
          # и push (мёрж плагина) — ребейзим и ретраим на случай non-fast-forward.
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed — retrying after rebase."
            sleep "$((attempt * 3))"
          done
          echo "::error::Не удалось запушить plugins-registry.json после 3 попыток."
          exit 1
